[tool.poetry]
# Application project, not a distributable library (Task 09, spec direction).
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.110"
uvicorn = { extras = ["standard"], version = ">=0.27" }
pydantic = ">=2.6"
pydantic-settings = ">=2.1"
sqlalchemy = ">=2.0"
pgvector = ">=0.2"
psycopg2-binary = ">=2.9"
python-dotenv = ">=1.0"
openai = ">=1.0"
# Loads the pre-generated IFC ontology vectors (`.npy`) in
# app/query/semantic/ontology/loader.py. Declared explicitly: it used to arrive
# only as a transitive dependency of torch, so an install without the embedding
# group could not even collect the test suite.
numpy = ">=1.26"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"
ruff = ">=0.4"
# Used by tests/test_deployment_policy.py to assert the compose files really
# carry the security posture the docs claim. Declared explicitly rather than
# relied on transitively (uvicorn[standard] happens to pull it) — that is the
# same undeclared-dependency trap numpy was in.
pyyaml = ">=6.0"

# ---------------------------------------------------------------------------
# Query-embedding runtime — OPTIONAL, and deliberately so.
# ---------------------------------------------------------------------------
# Semantic (RAG) retrieval embeds the user's question with the same model the
# stored corpus was embedded with (BAAI/bge-m3, dim 1024). That pulls in torch:
# a multi-gigabyte, hardware-specific install.
#
# It is a group, not a core dependency, because the backend does not need it to
# start, to serve SQL/graph answers, or to run its offline test suite — the
# embedding service raises `EmbeddingServiceUnavailableError` and the RAG path
# reports a degraded mode rather than crashing. Making it required would mean
# every CI run and every container build downloaded a CUDA wheel to execute
# tests that never load a model.
#
#   poetry install                     # API + tests, no torch  (CI, quick start)
#   poetry install --with embedding    # adds semantic retrieval (this pins CUDA)
#
# The pin below is the owner's CUDA build. For a CPU-only machine or container,
# install torch from https://download.pytorch.org/whl/cpu instead.
[tool.poetry.group.embedding]
optional = true

[tool.poetry.group.embedding.dependencies]
torch = { version = "2.11.0+cu128", source = "pytorch-cu128" }
sentence-transformers = ">=2.7"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The DEFAULT run is the fast offline gate: no database, no embedding model, no
# OpenAI. Everything under tests/query_live is marked `live` by that package's
# conftest and deselected here, so a database-dependent check can never enter
# the default path silently. Run it explicitly with `pytest -m live`.
addopts = "-q -m 'not live'"
markers = [
    "live: requires a live read-only PostgreSQL connection (and, for RAG cases, the local embedding model). Deselected by default; run with `pytest -m live`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
