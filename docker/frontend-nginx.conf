server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Deliberately NOT setting Cross-Origin-Embedder-Policy. It would be needed
    # only if the fragments worker used SharedArrayBuffer, and the Vite dev
    # server sets no such header while the viewer works there — so requiring it
    # here could only break cross-origin loads, never enable anything.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY    always;
    add_header Referrer-Policy        no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached, or a rebuilt
    # bundle would keep loading behind a stale entry point.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths render the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
