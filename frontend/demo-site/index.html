<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIMtrieval — Static Demo</title>
    <meta
      name="description"
      content="A static demo of BIMtrieval: natural-language questions answered over an IFC building model by SQL, graph traversal, and semantic retrieval. Three pre-recorded answers, no live backend."
    />
    <style>
      /* Shown from the very first paint, before any JavaScript runs.

         The demo's engine bundle is several megabytes, so there is a real
         window between "the page arrived" and "React mounted" during which the
         screen would otherwise be a flat, unexplained grey — which reads as
         broken rather than as loading. React clears #root on its first render,
         so this removes itself with no teardown code. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(120% 120% at 50% 0%, #edf1f5 0%, #e1e7ed 70%);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(31, 111, 235, 0.18);
        border-top-color: #1f6feb;
        border-radius: 50%;
        animation: boot-spin 820ms linear infinite;
      }
      .boot-text {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #55636f;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2400ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <div class="boot-spinner"></div>
        <p class="boot-text">Loading BIMtrieval</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
